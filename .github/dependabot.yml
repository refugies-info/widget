version: 2
updates:
  - package-ecosystem: "npm" # Covers pnpm-lock.yaml.
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # No include list: the default covers all dependencies.
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "npm" # The front, see the ignore rule below.
    directory: "/front"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
    ignore:
      # svelte-check does not support TypeScript 7 yet: remove this once it does.
      - dependency-name: "typescript"
        update-types: ["version-update:semver-major"]
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
