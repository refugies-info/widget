version: 2
updates:
  - package-ecosystem: "npm" # Covers pnpm-lock.yaml.
    directories: ["/", "/front"]
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7 # No include list: the default covers all dependencies.
    open-pull-requests-limit: 5
    groups:
      npm-minor-patch:
        applies-to: version-updates
        update-types:
          - "minor"
          - "patch"
  - package-ecosystem: "github-actions"
    directory: "/"
    schedule:
      interval: "weekly"
    cooldown:
      default-days: 7
    open-pull-requests-limit: 5
