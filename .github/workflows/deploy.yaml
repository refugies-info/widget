name: Deploy

permissions:
  contents: read

on:
  push:
    branches:
      - staging
      - production
  workflow_dispatch:

concurrency:
  group: deploy-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  deploy:
    name: Deploy to ${{ github.ref_name }}
    if: github.ref_name == 'staging' || github.ref_name == 'production'
    runs-on: ubuntu-latest
    timeout-minutes: 30
    environment: ${{ github.ref_name }}
    steps:
      - name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Trigger and await the Cloud Build
        env:
          TRIGGER_ID: ${{ vars.CLOUD_BUILD_TRIGGER_ID }}
          BRANCH: ${{ github.ref_name }}
        run: |
          echo "Triggering Cloud Build ($TRIGGER_ID) on $BRANCH..."
          BUILD_ID=$(gcloud builds triggers run "$TRIGGER_ID" \
            --branch="$BRANCH" \
            --project=refugies-info \
            --format='value(metadata.build.id)')

          echo "Build ID: $BUILD_ID"
          echo "https://console.cloud.google.com/cloud-build/builds/$BUILD_ID?project=refugies-info"

          until [[ "$STATUS" == "SUCCESS" || "$STATUS" == "FAILURE" || "$STATUS" == "CANCELLED" || "$STATUS" == "TIMEOUT" || "$STATUS" == "EXPIRED" ]]; do
            sleep 30
            STATUS=$(gcloud builds describe "$BUILD_ID" \
              --project=refugies-info \
              --format='value(status)')
            echo "Status: $STATUS"
          done

          if [[ "$STATUS" != "SUCCESS" ]]; then
            echo "Build failed: $STATUS"
            exit 1
          fi
          echo "Deployed successfully"
